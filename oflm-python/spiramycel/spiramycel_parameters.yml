# Shared configuration for both paradigms
shared:
  # Scientific experiment settings (reproduced from published results)
  experiment:
    random_seed: 42                    # Fixed seed for reproducibility
    statistical_validation: true      # Enable cross-validation testing
    significance_threshold: 0.05       # p < 0.05 for statistical significance
    effect_size_target: 1.0           # Cohen's d target (large effect)
    
  # Hardware optimization
  hardware:
    force_cpu_mode: true              # Democratic access - no GPU required
    memory_limit_mb: 512              # Conservative memory usage
    training_timeout_minutes: 15      # Per model training limit
    
  # Contemplative principles (scientifically validated)
  contemplative:
    silence_majority_ratio: 0.875     # 87.5% silence as default wisdom
    environmental_responsiveness: true # Adapt to NetworkConditions
    seasonal_memory_days: 75          # Evaporating memory cycles
    glyph_vocabulary_size: 64         # Core contemplative symbols
    
  # Multi-objective loss weighting
  loss_weights:
    glyph_generation: 1.0             # Primary sequence generation
    effectiveness_prediction: 0.8     # Infrastructure repair effectiveness  
    silence_majority: 1.2             # Contemplative restraint (most important)
    
# Environment configurations (from validated experiment)
environments:
  calm:
    description: "Stable network conditions for pure contemplative expression"
    network_stability: 0.9
    expected_silence_ratio: 1.0       # 100% silence in calm conditions
    
  chaotic:
    description: "Crisis network conditions requiring adaptive intervention"  
    network_stability: 0.3
    expected_silence_ratio: 0.375     # Average 37.5% silence (25% ecological, 50% abstract)
    stress_testing: true

# Global configuration
global:
  # Shared settings across all models
  random_seed: 42
  contemplative_framework: "silence_majority"
  mycelial_networking: true
  
  # File paths
  default_data_dir: "training_scenarios"
  default_model_dir: "."  # Keep existing structure
  log_dir: "logs"
  
  # Safety and stability
  cpu_safety_mode: true
  memory_efficient: true
  error_recovery: true
  
  # Contemplative AI principles
  silence_majority_principle: 0.875
  bioregional_respect: true
  community_consensus: false  # Not implemented yet
  temporal_intelligence: true 