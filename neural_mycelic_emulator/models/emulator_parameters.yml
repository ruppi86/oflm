shared_defaults:
  vocab_size: 16      # 8 activity glyphs + 8 channel prefixes
  embed_dim: 16
  batch_size: 256
  learning_rate: 0.001

models:
  cordyceps_small:
    species: cordyceps_militaris
    hidden_dim: 64
    num_layers: 1
    epochs: 15
    dataset: neural_mycelic_emulator/dataset/Cordyceps_militari/Cordyceps_militari.txt

  cordyceps_medium:
    species: cordyceps_militaris
    hidden_dim: 128
    num_layers: 2
    epochs: 30
    dataset: neural_mycelic_emulator/dataset/Cordyceps_militari/Cordyceps_militari.txt

  # --- experimental model -------------------------------------------------
  cordyceps_medium_ctx128:
    species: cordyceps_militaris
    hidden_dim: 128
    num_layers: 2
    window: 128         # double context for better ISI matching
    epochs: 30
    batch_size: 64      # fits 8-GB GPU with longer window & smaller dim
    learning_rate: 0.0008
    aux_isi_loss: 0.1   # placeholder – trainer currently ignores
    dataset: neural_mycelic_emulator/dataset/Cordyceps_militari/Cordyceps_militari.txt

  cordyceps_large:
    species: cordyceps_militaris
    hidden_dim: 256
    num_layers: 3
    dropout: 0.2
    epochs: 40
    batch_size: 64
    dataset: neural_mycelic_emulator/dataset/Cordyceps_militari/Cordyceps_militari.txt

  cordyceps_large_ctx128:
    species: cordyceps_militaris
    hidden_dim: 256
    num_layers: 3
    window: 128
    dropout: 0.25
    batch_size: 48
    epochs: 40
    learning_rate: 0.0009
    aux_isi_loss: 0.1
    label_smoothing: 0.05
    dataset: neural_mycelic_emulator\dataset\Enoki_fungi_Flammulina_velutipes\Enoki_fungi_Flammulina_velutipes.txt


  cordyceps_xlarge:
    species: cordyceps_militaris
    embed_dim: 32        # bättre för fler kanaler
    hidden_dim: 384      # istället för 512 (färre parametrar men djupare kontext)
    num_layers: 4
    window: 128          # längre kontext ger bättre ISI-matchning
    dropout: 0.3         # lite högre pga fler parametrar
    batch_size: 36       # utnyttja GPU-minne bättre
    epochs: 30           # fler epoker när fönstret är längre
    learning_rate: 0.0007
    dataset: neural_mycelic_emulator/dataset/Cordyceps_militari/Cordyceps_militari.txt

  # --- new ultra capacity models with extended context --------------------
  cordyceps_xlarge_ctx128:
    species: cordyceps_militaris
    embed_dim: 32
    hidden_dim: 384
    num_layers: 4
    window: 128
    dropout: 0.3
    batch_size: 36
    epochs: 30
    learning_rate: 0.0007
    aux_isi_loss: 0.1
    label_smoothing: 0.05
    dataset: neural_mycelic_emulator/dataset/Cordyceps_militari/Cordyceps_militari.txt


  cordyceps_xlarge_ctx128_v2:
    species: cordyceps_militaris
    embed_dim:        32
    hidden_dim:       384
    num_layers:       4
    window:           192        # extend context – enoki glyphs show long-range rhythm
    dropout:          0.3
    label_smoothing:  0.05
    aux_isi_loss:     0.15       # raise weight to emphasise timing
    learning_rate:    0.0007
    batch_size:       28         # fits 24 GB GPU
    epochs:           45         # dataset is smaller; longer training helps

  # ENOKI flammulina_velutipes
  
  enoki_small:
    species: flammulina_velutipes
    hidden_dim: 64
    num_layers: 1
    epochs: 15
    dataset: neural_mycelic_emulator\dataset\Enoki_fungi_Flammulina_velutipes\Enoki_fungi_Flammulina_velutipes.txt

  enoki_medium:
    species: flammulina_velutipes
    hidden_dim: 128
    num_layers: 2
    epochs: 30
    dataset: neural_mycelic_emulator\dataset\Enoki_fungi_Flammulina_velutipes\Enoki_fungi_Flammulina_velutipes.txt   

  # --- experimental model -------------------------------------------------
  enoki_medium_ctx128:
    species: flammulina_velutipes
    hidden_dim: 128
    num_layers: 2
    window: 128
    epochs: 40
    dropout: 0.2
    batch_size: 48
    learning_rate: 0.0008
    aux_isi_loss: 0.1
    dataset: neural_mycelic_emulator\dataset\Enoki_fungi_Flammulina_velutipes\Enoki_fungi_Flammulina_velutipes.txt

  enoki_large:
    species: flammulina_velutipes
    hidden_dim: 256
    num_layers: 3
    dropout: 0.2
    epochs: 40
    batch_size: 64
    dataset: neural_mycelic_emulator\dataset\Enoki_fungi_Flammulina_velutipes\Enoki_fungi_Flammulina_velutipes.txt

  enoki_large_ctx128:
    species: flammulina_velutipes
    hidden_dim: 256
    num_layers: 3
    window: 128
    dropout: 0.25
    batch_size: 48
    epochs: 40
    learning_rate: 0.0009
    aux_isi_loss: 0.1
    label_smoothing: 0.05
    dataset: neural_mycelic_emulator\dataset\Enoki_fungi_Flammulina_velutipes\Enoki_fungi_Flammulina_velutipes.txt


  enoki_xlarge_ctx128:
    species: flammulina_velutipes
    embed_dim: 32
    hidden_dim: 384
    num_layers: 4
    window: 128
    dropout: 0.3
    batch_size: 32
    epochs: 40
    learning_rate: 0.0008
    aux_isi_loss: 0.1
    label_smoothing: 0.05
    dataset: neural_mycelic_emulator/dataset/Enoki_fungi_Flammulina_velutipes/Enoki_fungi_Flammulina_velutipes.txt

  enoki_xlarge_ctx192
    embed_dim:        32
    hidden_dim:       384
    num_layers:       4
    window:           192        # extend context – enoki glyphs show long-range rhythm
    dropout:          0.3
    label_smoothing:  0.05
    aux_isi_loss:     0.15       # raise weight to emphasise timing
    learning_rate:    0.0007
    batch_size:       28         # fits 24 GB GPU
    epochs:           45         # dataset is smaller; longer training helps
    

  # GHOST omphalotus_nidiformis

  ghost_small:
    species: omphalotus_nidiformis
    hidden_dim: 64
    num_layers: 1
    epochs: 15
    dataset: neural_mycelic_emulator/dataset/Ghost_Fungi_Omphalotus_nidiformis/Ghost_Fungi_Omphalotus_nidiformis.txt

  ghost_medium:
    species: omphalotus_nidiformis
    hidden_dim: 128
    num_layers: 2
    epochs: 30
    dataset: neural_mycelic_emulator/dataset/Ghost_Fungi_Omphalotus_nidiformis/Ghost_Fungi_Omphalotus_nidiformis.txt

  # --- experimental model -------------------------------------------------
  ghost_medium_ctx128:
    species: omphalotus_nidiformis
    hidden_dim: 128
    num_layers: 2
    window: 128
    epochs: 30
    batch_size: 48
    learning_rate: 0.0008
    aux_isi_loss: 0.1
    dataset: neural_mycelic_emulator/dataset/Ghost_Fungi_Omphalotus_nidiformis/Ghost_Fungi_Omphalotus_nidiformis.txt

  ghost_large:
    species: omphalotus_nidiformis
    hidden_dim: 256
    num_layers: 3
    dropout: 0.2
    epochs: 24  # Very large training set
    batch_size: 64
    dataset: neural_mycelic_emulator/dataset/Ghost_Fungi_Omphalotus_nidiformis/Ghost_Fungi_Omphalotus_nidiformis.txt

