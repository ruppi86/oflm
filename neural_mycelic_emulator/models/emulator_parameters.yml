  ghost_xlarge_ctx128:
    species: omphalotus_nidiformis
    embed_dim: 32
    hidden_dim: 384
    num_layers: 4
    window: 128
    dropout: 0.3
    batch_size: 32
    epochs: 24  # large dataset, keep training time reasonable
    learning_rate: 0.0008
    aux_isi_loss: 0.1
